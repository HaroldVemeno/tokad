[package]
name = "tokad"
version = "0.1.0"
edition = "2024"

[[bin]] # Bin to run the HelloWorld gRPC server
name = "tokad"
path = "src/bin.rs"

[dependencies]
tonic = "*"
prost = "0.14"
tonic-prost = "*"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }
clap = { version = "4.5.47", features = ["derive"] }
rand = "0.9.2"
ratatui = { version = "0.29.0", features = ["unstable-rendered-line-info"] }
tui-input = "0.14.0"

[build-dependencies]
tonic-prost-build = "*"
