[package]
name = "tokad"
version = "0.1.0"
edition = "2024"

[[bin]] # Bin to run the HelloWorld gRPC server
name = "tokad"
path = "src/bin.rs"

[dependencies]
tonic = "0.14"
prost = "0.14"
tonic-prost = "0.14"
rand = "0.10"
clap = { version = "4.6", features = ["derive"] }
futures = "0.3"
tokio = { version = "1.52", features = ["full", "macros", "rt-multi-thread", "tracing"] }
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
tui-input = "0.15"
blake3 = "1.8"
tracing = "0.1"
tracing-subscriber = "0.3"
tui-tracing = "0.2"
crossbeam-utils = "0.8"
circular-queue = "0.2"
console-subscriber = { version = "0.5", optional = true }

[features]
default = []
tokio-console = ["dep:console-subscriber"]


[build-dependencies]
tonic-prost-build = "*"
